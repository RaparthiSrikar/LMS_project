openapi: 3.0.3
info:
  title: Enterprise LMS API
  version: 1.0.0
  description: Complete API documentation for the Enterprise Learning Management System
    (LMS).
paths:
  /api/assignments/assignments/:
    get:
      operationId: assignments_assignments_list
      description: 'Trainer: create assignment, upload files, set due date, assign
        marks.'
      parameters:
      - in: query
        name: course
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - assignments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentList'
          description: ''
    post:
      operationId: assignments_assignments_create
      description: 'Trainer: create assignment, upload files, set due date, assign
        marks.'
      tags:
      - assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
