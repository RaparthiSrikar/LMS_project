components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        trainer:
          type: integer
          readOnly: true
        trainer_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        published_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - id
      - message
      - published_at
      - title
      - trainer
      - trainer_name
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attempt:
          type: integer
        question:
          type: integer
        selected_choice:
          type: integer
          nullable: true
        code_answer:
          type: string
        is_correct:
          type: boolean
          readOnly: true
          nullable: true
      required:
      - attempt
      - id
      - is_correct
      - question
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        course_name:
          type: string
          readOnly: true
        trainer:
          type: integer
          readOnly: true
        trainer_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        file:
          type: string
          format: uri
          nullable: true
        due_date:
          type: string
          format: date-time
        max_marks:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - course_name
      - created_at
      - due_date
      - id
      - title
      - trainer
      - trainer_name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Choice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 500
        is_correct:
          type: boolean
      required:
      - id
      - text
    Coupon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 30
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        valid_until:
          type: string
          format: date-time
        max_uses:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        used_count:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        active:
          type: boolean
      required:
      - code
      - discount_percent
      - id
      - valid_until
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        duration_weeks:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        final_price:
          type: string
          readOnly: true
        thumbnail:
          type: string
          format: uri
          nullable: true
        banner:
          type: string
          format: uri
          nullable: true
        video_preview:
          type: string
          format: uri
          nullable: true
        trainer:
          type: integer
          nullable: true
        trainer_name:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: integer
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - created_at
      - final_price
      - id
      - name
      - trainer_name
      - updated_at
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        course:
          type: integer
        course_name:
          type: string
          readOnly: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
        progress_percent:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        is_completed:
          type: boolean
        is_paused:
          type: boolean
      required:
      - course
      - course_name
      - enrolled_at
      - id
      - student
      - student_name
    GatewayEnum:
      enum:
      - stripe
      - razorpay
      type: string
      description: |-
        * `stripe` - Stripe
        * `razorpay` - Razorpay
    Invoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payment:
          type: integer
        invoice_number:
          type: string
          maxLength: 50
        issued_at:
          type: string
          format: date-time
          readOnly: true
        pdf_file:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - issued_at
      - payment
    LevelEnum:
      enum:
      - beginner
      - intermediate
      - advanced
      type: string
      description: |-
        * `beginner` - Beginner
        * `intermediate` - Intermediate
        * `advanced` - Advanced
    LiveSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 255
        meeting_link:
          type: string
          format: uri
          maxLength: 200
        scheduled_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - meeting_link
      - scheduled_at
      - title
    Note:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
        date:
          type: string
          format: date
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - file
      - id
      - title
      - uploaded_at
    PaginatedAnnouncementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
    PaginatedAnswerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
