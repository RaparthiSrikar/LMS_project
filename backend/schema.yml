      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - hr
          - student
          - super_admin
          - trainer
        description: |-
          * `super_admin` - Super Admin
          * `admin` - Admin
          * `trainer` - Trainer
          * `student` - Student
          * `hr` - HR
